worker_processes auto;
pid /tmp/nginx.backend.pid;

events {
    worker_connections 1024;
}

http {
    access_log /app/apps/backend/logs/nginx_access.log;
    error_log /app/apps/backend/logs/nginx_error.log warn;

    server {
        # This will be dynamically replaced by Render's $PORT using envsubst
        listen ${NGINX_PORT};
        server_name localhost;

        # Socket.IO — needs WebSocket upgrade headers
        location /socket.io {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else (including /webhooks and /api) goes to the Node.js app
        location / {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
