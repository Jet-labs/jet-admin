worker_processes auto;
pid /tmp/nginx.backend.pid;

events {
    worker_connections 1024;
}

http {
    access_log /app/apps/backend/logs/nginx_access.log;
    error_log /app/apps/backend/logs/nginx_error.log warn;

    server {
        # NGINX listens on 3000
        # The environment variable $PORT might be injected by Render, 
        # but NGINX conf requires a template or hardcoded value.
        # We will use 3000 as requested.
        listen 3000;
        server_name localhost;

        # Webhooks go to the internal webhook receiver (8095)
        location /webhooks {
            proxy_pass http://127.0.0.1:8095;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO gets upgraded properly to the main API (8090)
        location /socket.io {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else (API) goes to the main Node API (8090)
        location / {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
