# ============================================
# Jet Admin - Backend nginx (reverse proxy INSIDE backend container)
# ============================================
# Rendered at container start by docker-entrypoint.backend.sh via envsubst
# restricted to NGINX_PORT, NODE_PORT and CLIENT_MAX_BODY_SIZE.
# The entrypoint guarantees all three are set (defaults: 3000 / 3001 / 10m),
# so this template uses plain dollar-brace VAR references (envsubst does NOT
# support the shell-style default syntax).
# NOTE: $host / $remote_addr / etc. below are nginx variables — they are left
# untouched because envsubst is restricted to the three names above.
#
# Layout: nginx listens on ${NGINX_PORT} (compose: 3000, Render: $PORT),
# Node.js listens on 127.0.0.1:${NODE_PORT} (entrypoint exports PORT=$NODE_PORT).
# Frontend hits backend:3000 (= nginx), which proxies everything to Node.

user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /app/apps/backend/logs/nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /app/apps/backend/logs/nginx_access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    upstream node_app {
        server 127.0.0.1:${NODE_PORT};
        keepalive 32;
    }

    server {
        listen ${NGINX_PORT};
        server_name localhost;

        # Health — proxied so compose/Render healthchecks verify Node, not just nginx
        location /health {
            access_log off;
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Socket.IO — needs WebSocket upgrade headers + long timeouts
        location /socket.io {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else (including /api and /webhooks) goes to Node.js
        location / {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
